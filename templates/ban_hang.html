<h2>Bán Hàng</h2>
{% if error %}
<div style="color:red; margin-bottom:10px;">
    {{ error }}
</div>
{% endif %}
<form method="POST">
    Sản phẩm:
    <select name="product_id">
        {% for p in products %}
        <option value="{{ p[0] }}">{{ p[2] }}</option>
        {% endfor %}
    </select><br>
    Tháng: <input name="month"><br>
    Số lượng bán: <input name="quantity"><br>
    <button>Bán</button>
</form>

<a href="/dashboard">Dashboard</a>
